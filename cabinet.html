---
layout: none
---
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет | vClearance</title>
<link rel="icon" href="https://i.imgur.com/X9EWcyh.png">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<style>
    body { background:#0d0d0d; min-height:100vh; }
    .cab-top { padding:16px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.06); }
    .cab-top .brand { display:flex; align-items:center; gap:10px; }
    .cab-top .brand img { width:32px; height:32px; border-radius:8px; }
    .cab-top .brand span { font-size:14px; font-weight:700; color:#fff; }
    .cab-top a.back { font-size:12px; color:#888; text-decoration:none; }
    .cab-top a.back:hover { color:#fff; }

    #loginGate { min-height:calc(100vh - 65px); display:flex; align-items:center; justify-content:center; padding:20px; }
    #loginGate .gate-box { width:100%; max-width:360px; background:#141414; border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    #loginGate h1 { text-align:center; font-size:16px; text-transform:uppercase; letter-spacing:0.5px; color:#fff; margin-bottom:4px; }
    #loginGate p.sub { text-align:center; font-size:12px; color:#888; margin-bottom:22px; }

    #cabApp { display:none; max-width:1000px; margin:0 auto; padding:30px 24px 60px; }
    .cab-header { display:flex; align-items:center; gap:16px; margin-bottom:26px; }
    .cab-avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#2ecc71,#27ae60); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; color:#04140a; }
    .cab-header h2 { font-size:19px; color:#fff; }
    .cab-header .cid-tag { font-size:12px; color:#888; }
    .logout-link { margin-left:auto; font-size:11.5px; color:#e74c3c; cursor:pointer; }
    .logout-link:hover { text-decoration:underline; }

    .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
    .stat-box { background:#151515; border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:18px; text-align:center; }
    .stat-box h4 { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#888; font-weight:500; margin-bottom:8px; }
    .stat-box .num { font-size:28px; font-weight:800; color:#2ecc71; }

    .card { background:#151515; border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:18px 18px 8px; margin-bottom:22px; }
    .card h3 { font-size:13px; text-transform:uppercase; letter-spacing:0.4px; color:#fff; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.06); }

    /* Бот / чат */
    .bot-actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .bot-actions button {
        flex:1; min-width:140px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
        color:#eee; padding:12px; border-radius:10px; font-size:12.5px; cursor:pointer; font-weight:600; transition:0.15s;
    }
    .bot-actions button:hover { background:rgba(46,204,113,0.12); border-color:rgba(46,204,113,0.35); color:#2ecc71; }
    .chat-msgs { max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 2px 14px; }
    .msg { max-width:78%; padding:9px 13px; border-radius:12px; font-size:13px; line-height:1.45; }
    .msg.user { align-self:flex-end; background:#1d5c3a; color:#eafff0; border-bottom-right-radius:3px; }
    .msg.admin { align-self:flex-start; background:#222; color:#eee; border-bottom-left-radius:3px; }
    .msg .cat { display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px; opacity:0.65; margin-bottom:3px; }
    .msg .replier { display:block; font-size:9.5px; font-weight:700; color:#7fffa8; letter-spacing:0.2px; margin-bottom:3px; }
    .msg .ts { display:block; font-size:9.5px; opacity:0.5; margin-top:4px; }
    .chat-empty { text-align:center; color:#666; font-size:12px; padding:16px 0; }
    .chat-composer { display:none; flex-direction:column; gap:10px; margin-top:4px; }
    .chat-composer textarea {
        width:100%; resize:vertical; min-height:96px; max-height:260px; overflow-y:auto;
        background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:10px;
        color:#eee; font-size:13.5px; font-family:inherit; line-height:1.5; padding:12px 14px;
        box-sizing:border-box; transition:0.15s;
    }
    .chat-composer textarea::placeholder { color:#777; }
    .chat-composer textarea:focus { outline:none; border-color:rgba(46,204,113,0.5); background:rgba(255,255,255,0.06); }
    .chat-composer button { align-self:flex-end; width:auto; padding:0 20px; height:40px; background:#2ecc71; color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer; transition:0.15s; }
    .chat-composer button:hover { background:#27ae60; }
    .chat-composer .hint { font-size:10.5px; color:#666; margin:2px 2px 0; }
</style>
</head>
<body>

    <div class="cab-top">
        <div class="brand"><span>Личный кабинет</span></div>
        <a class="back" href="{{ '/' | relative_url }}">← На главную</a>
    </div>

    <div id="loginGate">
        <div class="gate-box">
            <h1>Личный кабинет</h1>
            <p class="sub">Войдите под своим VATSIM CID</p>
            <div class="profile-login-form">
                <input type="text" id="gateCid" placeholder="VATSIM CID" autocomplete="off" maxlength="8">
                <input type="password" id="gatePassword" placeholder="Пароль (если задан)" autocomplete="off" onkeydown="if(event.key==='Enter') doLogin();">
                <button onclick="doLogin()">Войти</button>
                <div id="gateError" style="display:none; color:#ff4d4d; font-size:12px; margin-top:6px; text-align:center;"></div>
            </div>
        </div>
    </div>

    <div id="cabApp">
        <div class="cab-header">
            <div class="cab-avatar" id="cabAvatar">?</div>
            <div>
                <h2 id="cabName">—</h2>
                <div class="cid-tag" id="cabCid">CID —</div>
            </div>
            <div class="logout-link" onclick="doLogout()">Выйти</div>
        </div>

        <div class="stat-row">
            <div class="stat-box"><h4>Вылетов за клиренс</h4><div class="num" id="statClr">0</div></div>
            <div class="stat-box"><h4>Последний вылет</h4><div class="num" id="statLast" style="font-size:14px; padding-top:6px;">—</div></div>
        </div>

        <div class="card">
            <h3>Мои полёты за клиренс</h3>
            <div style="max-height:300px; overflow-y:auto;">
                <table class="roster-table" style="font-size:12px;">
                    <thead><tr><th>Дата</th><th>Позывной</th><th>Маршрут</th><th>Тип ВС</th></tr></thead>
                    <tbody id="flightsBody"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3>Связь с администрацией</h3>
            <div class="bot-actions">
                <button onclick="openComposer('help')">🆘 Помощь</button>
                <button onclick="openComposer('bug')">🐞 Сообщить о баге</button>
                <button onclick="openComposer('idea')">💡 Предложить идею</button>
            </div>
            <div class="chat-msgs" id="chatMsgsBox"><div class="chat-empty">Пока нет сообщений — выберите тему выше</div></div>
            <div class="chat-composer" id="chatComposer">
                <textarea id="chatInput" rows="4" placeholder="Опишите ваш вопрос..." oninput="autoGrow(this)" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"></textarea>
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getFirestore, doc, getDoc, getDocs, setDoc, addDoc, collection, onSnapshot, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCa2nr-heFF5LqoqN_tPYGJpf9PGhqMydo",
    authDomain: "vclearance-15b43.firebaseapp.com",
    projectId: "vclearance-15b43",
    storageBucket: "vclearance-15b43.firebasestorage.app",
    messagingSenderId: "299361728910",
    appId: "1:299361728910:web:7e77b2f4431db23a66ccdf"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const BASE_PILOTS = [{ cid: "1816284", name: "Karim I." }];
let currentCid = null;
let currentName = 'Пилот';
let pendingCategory = null;

const CAT_LABEL = { help: 'Помощь', bug: 'Баг', idea: 'Идея' };

const CABINET_SESSION_KEY = 'vc_cabinet_session'; // localStorage — запоминает вход в ЛК между визитами

/* ---------------- ВХОД (та же логика паролей, что и на сайте) ---------------- */
async function verifyPilot(cid, password) {
    const snap = await getDoc(doc(db, 'pilot_auth', cid));
    if (snap.exists()) {
        const data = snap.data();
        if (data.password !== password) return false;
    }
    // Если для CID ещё не выдан пароль — вход выполняется по одному CID
    // (так же, как кнопка «это я!» на сайте), пока админ не выдаст пароль.
    return true;
}

window.doLogin = async function() {
    const cid = document.getElementById('gateCid').value.trim();
    const password = document.getElementById('gatePassword').value;
    const errDiv = document.getElementById('gateError');
    errDiv.style.display = 'none';
    if (!cid) return;

    try {
        const ok = await verifyPilot(cid, password);
        if (!ok) {
            errDiv.textContent = 'Неверный пароль!';
            errDiv.style.display = 'block';
            return;
        }
        localStorage.setItem(CABINET_SESSION_KEY, JSON.stringify({ cid, password }));
        enterCabinet(cid);
    } catch (e) {
        console.error(e);
        errDiv.textContent = 'Ошибка проверки. Попробуйте снова.';
        errDiv.style.display = 'block';
    }
};

window.doLogout = function() {
    localStorage.removeItem(CABINET_SESSION_KEY);
    location.reload();
};

// При открытии страницы пробуем восстановить сохранённый вход в ЛК,
// заново проверяя CID+пароль в Firebase (на случай, если пароль сменили).
(async function restoreSession() {
    const raw = localStorage.getItem(CABINET_SESSION_KEY);
    if (!raw) return;
    try {
        const { cid, password } = JSON.parse(raw);
        const ok = await verifyPilot(cid, password);
        if (ok) {
            enterCabinet(cid);
        } else {
            localStorage.removeItem(CABINET_SESSION_KEY);
        }
    } catch (e) {
        localStorage.removeItem(CABINET_SESSION_KEY);
    }
})();

async function enterCabinet(cid) {
    currentCid = cid.toString();
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('cabApp').style.display = 'block';
    document.getElementById('cabCid').textContent = 'CID ' + currentCid;

    // Имя ищем среди базовых + добавленных пилотов
    try {
        let name = null;
        const baseMatch = BASE_PILOTS.find(p => p.cid.toString() === currentCid);
        if (baseMatch) name = baseMatch.name;
        if (!name) {
            const cpSnap = await getDoc(doc(db, 'custom_pilots', currentCid));
            if (cpSnap.exists()) name = cpSnap.data().name;
        }
        currentName = name || ('CID ' + currentCid);
    } catch (e) { currentName = 'CID ' + currentCid; }

    document.getElementById('cabName').textContent = currentName;
    document.getElementById('cabAvatar').textContent = currentName.trim().charAt(0).toUpperCase() || '?';

    loadFlights();
    ensureThreadAndListen();
}

/* ---------------- ПОЛЁТЫ ЗА КЛИРЕНС ---------------- */
async function loadFlights() {
    try {
        const snap = await getDocs(query(collection(db, 'recent_flights'), where('cid', '==', currentCid)));
        const flights = snap.docs.map(d => d.data()).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        document.getElementById('statClr').textContent = flights.length;
        document.getElementById('statLast').textContent = flights.length
            ? new Date(flights[0].timestamp).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })
            : '—';

        document.getElementById('flightsBody').innerHTML = flights.map(f => `
            <tr>
                <td style="color:#aaa;">${new Date(f.timestamp).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                <td>${escapeHtml(f.callsign || '---')}</td>
                <td>${escapeHtml(f.route || '---')}</td>
                <td>${escapeHtml(f.aircraft || '---')}</td>
            </tr>
        `).join('') || `<tr><td colspan="4" style="text-align:center; padding:16px; color:#666;">Полётов за клиренс пока нет</td></tr>`;
    } catch (e) { console.error('Ошибка загрузки полётов:', e); }
}

/* ---------------- ЧАТ-БОТ ---------------- */
window.openComposer = function(category) {
    pendingCategory = category;
    const composer = document.getElementById('chatComposer');
    composer.style.display = 'flex';
    const input = document.getElementById('chatInput');
    input.placeholder = `Тема: ${CAT_LABEL[category]}. Опишите подробнее...`;
    input.style.height = 'auto';
    input.focus();
};

window.autoGrow = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
};

window.sendMessage = async function() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    const nowIso = new Date().toISOString();
    try {
        await addDoc(collection(db, 'chat_threads', currentCid, 'messages'), {
            from: 'user', text, category: pendingCategory, timestamp: nowIso
        });
        await setDoc(doc(db, 'chat_threads', currentCid), {
            cid: currentCid, name: currentName, lastMessage: text, lastTimestamp: nowIso,
            lastFrom: 'user', unreadForAdmin: true, archived: false
        }, { merge: true });
        document.getElementById('chatComposer').style.display = 'none';
        pendingCategory = null;
    } catch (e) { console.error(e); alert('Не удалось отправить сообщение. Попробуйте ещё раз.'); }
};

function ensureThreadAndListen() {
    onSnapshot(query(collection(db, 'chat_threads', currentCid, 'messages'), orderBy('timestamp', 'asc')), snap => {
        const box = document.getElementById('chatMsgsBox');
        if (snap.empty) {
            box.innerHTML = `<div class="chat-empty">Пока нет сообщений — выберите тему выше</div>`;
            return;
        }
        box.innerHTML = snap.docs.map(d => {
            const m = d.data();
            return `
                <div class="msg ${m.from === 'admin' ? 'admin' : 'user'}">
                    ${m.from === 'admin' ? `<span class="replier">${escapeHtml(m.adminName || 'Администрация')}</span>` : ''}
                    ${m.category ? `<span class="cat">${CAT_LABEL[m.category] || m.category}</span><br>` : ''}
                    ${escapeHtml(m.text || '')}
                    <span class="ts">${new Date(m.timestamp).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span>
                </div>
            `;
        }).join('');
        box.scrollTop = box.scrollHeight;
        // Пометить как прочитанное пользователем
        setDoc(doc(db, 'chat_threads', currentCid), { unreadForUser: false }, { merge: true }).catch(() => {});
    });
}

function escapeHtml(str) {
    return (str || '').toString().replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
</script>
</body>
</html>
